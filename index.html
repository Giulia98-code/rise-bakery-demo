<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us // Rise Bakery Amsterdam</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');

    :root {
      --bg-yellow: #f8db66;
      --bg-body: #fcf9f5;
      --text-dark: #2c221e;
      --text-muted: #5c524b;
      --accent-brown: #4a382e;
      --border-light: #e0d5c5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
    }

    /* HEADER IN STILE RISE BAKERY */
    header {
      background-color: var(--bg-yellow);
      padding: 20px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .brand-logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--text-dark);
      text-decoration: none;
      text-transform: uppercase;
      text-align: center;
    }

    .brand-subtitle {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 3px;
      margin-top: -5px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    nav a.active, nav a:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    /* CONTENUTO PRINCIPALE CONTATTI */
    .contact-container {
      max-width: 1100px;
      margin: 50px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
    }

    .store-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid var(--border-light);
    }

    .store-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .map-box {
      width: 100%;
      height: 250px;
      border: none;
    }

    .contact-info {
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid var(--border-light);
    }

    .contact-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 24px;
      color: var(--text-dark);
    }

    .info-group {
      margin-bottom: 24px;
    }

    .info-group h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .info-group p, .info-group a {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
    }

    .info-group a:hover {
      text-decoration: underline;
    }

    /* FORM DI CONTATTO PULITO */
    .contact-form {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid var(--border-light);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background: var(--bg-body);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .btn-send {
      background: var(--accent-brown);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background: #32251e;
    }

    @media (max-width: 850px) {
      .contact-container {
        grid-template-columns: 1fr;
        gap: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER MODERNO CON STILE GIALLO ORIGINALE -->
  <header>
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        RISE
        <span class="brand-subtitle">BAKERY</span>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Location</a></li>
          <li><a href="#">Bakery</a></li>
          <li><a href="#">News</a></li>
          <li><a href="#">Wholesale</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- SEZIONE CONTATTI -->
  <main class="contact-container">
    
    <!-- COLONNA SINISTRA: FOTO E MAPPA -->
    <div class="store-card">
      <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80" alt="Rise Bakery Storefront" class="store-img">
      <iframe 
        class="map-box"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2436.578!2d4.8943!3d52.3564!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c609912061e8cd%3A0x83e28495bc27d14!2sAlbert%20Cuypstraat%20208H%2C%201073%20BM%20Amsterdam!5e0!3m2!1sen!2snl!4v1680000000000!5m2!1sen!2snl" 
        loading="lazy">
      </iframe>
    </div>

    <!-- COLONNA DESTRA: DATI E FORM -->
    <div class="contact-info">
      <h1>Get in Touch</h1>

      <div class="info-group">
        <h3>Address</h3>
        <p>RISE BAKERY<br>Albert Cuypstraat 208 H<br>1073 BM Amsterdam</p>
      </div>

      <div class="info-group">
        <h3>Email</h3>
        <p><a href="mailto:info@risebakery.nl">info@risebakery.nl</a></p>
      </div>

      <div class="info-group">
        <h3>Opening Hours</h3>
        <p>Wednesday – Sunday: 08:00 – 16:00<br>Monday & Tuesday: Closed</p>
      </div>

      <!-- FORM -->
      <form class="contact-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Your email">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="4" placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="btn-send">Send Message</button>
      </form>
    </div>

  </main>

</body>
</html>
